name: Build All

on:
  push:
    branches: [actions]
    paths:
      - 'core/**'
      - 'cfm/**'
      - 'server/**'
      - 'client/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'actions'
        type: string

env:
  GO_MIN_VER: "1.21"

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: all three arches use *-windows-gnullvm, which links with rust-lld
          # and therefore needs no libgcc/libgcc_eh (llvm-mingw does not ship them).
          # llvm-mingw still supplies the libmingwex/libmingw32 runtime that Go's
          # external linking requires. There is no i686-mingw-w64 equivalent, so gnullvm
          # is the only option for x86 (see mstorsjo/llvm-mingw#551).
          - os: windows-latest
            arch: x86_64
            goos: windows
            goarch: amd64
            rust-target: x86_64-pc-windows-gnullvm
            rust-linker: ""
            ext: ".exe"
            cc: x86_64-w64-mingw32-gcc
          - os: windows-latest
            arch: x86
            goos: windows
            goarch: 386
            rust-target: i686-pc-windows-gnullvm
            rust-linker: ""
            ext: ".exe"
            cc: i686-w64-mingw32-gcc
          - os: windows-latest
            arch: arm64
            goos: windows
            goarch: arm64
            rust-target: aarch64-pc-windows-gnullvm
            rust-linker: ""
            ext: ".exe"
            cc: aarch64-w64-mingw32-gcc

          # macOS (no 32-bit x86 support in Go/Rust toolchains)
          - os: macos-latest
            arch: x86_64
            goos: darwin
            goarch: amd64
            rust-target: x86_64-apple-darwin
            rust-linker: ""
            ext: ""
            cc: clang
          - os: macos-latest
            arch: arm64
            goos: darwin
            goarch: arm64
            rust-target: aarch64-apple-darwin
            rust-linker: ""
            ext: ""
            cc: clang

          # Linux
          - os: ubuntu-latest
            arch: x86_64
            goos: linux
            goarch: amd64
            rust-target: x86_64-unknown-linux-gnu
            rust-linker: ""
            ext: ""
            cc: gcc
          - os: ubuntu-latest
            arch: x86
            goos: linux
            goarch: 386
            rust-target: i686-unknown-linux-gnu
            rust-linker: ""
            ext: ""
            cc: gcc
          - os: ubuntu-latest
            arch: arm64
            goos: linux
            goarch: arm64
            rust-target: aarch64-unknown-linux-gnu
            rust-linker: aarch64-linux-gnu-gcc
            ext: ""
            cc: aarch64-linux-gnu-gcc

    steps:
      # ============================================================
      # Setup
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_MIN_VER }}

      # Install cross-compilation dependencies for Linux targets
      - name: Install cross-compilation deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "x86" ]; then
            sudo apt-get install -y gcc-multilib libc6-dev-i386
          fi
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      # Install llvm-mingw on Windows: one toolchain provides
      # x86_64 / i686 / aarch64 gcc wrappers plus the MinGW runtime
      # (libmingwex.a etc.) that Go's external linking requires.
      - name: Install llvm-mingw (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest' -Headers @{ 'User-Agent' = 'smp-ci' }
          $asset = $rel.assets | Where-Object { $_.name -match 'msvcrt-x86_64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'llvm-mingw msvcrt asset not found' }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile 'llvm-mingw.zip'
          Expand-Archive 'llvm-mingw.zip' -DestinationPath '.'
          $dir = Get-ChildItem -Directory -Filter 'llvm-mingw-*' | Select-Object -First 1
          "$($dir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding ascii

      # ============================================================
      # Build Rust Core & CFM
      # ============================================================
      - name: Build Core (Rust)
        working-directory: core
        run: |
          export CC=${{ matrix.cc }}
          if [ -n "${{ matrix.rust-linker }}" ]; then
            export CARGO_TARGET_$(echo ${{ matrix.rust-target }} | tr '[:lower:]' '[:upper:]' | tr '-' '_')_LINKER=${{ matrix.rust-linker }}
          fi
          cargo build --release --target ${{ matrix.rust-target }}
        shell: bash

      - name: Build CFM (Rust)
        working-directory: cfm
        run: |
          export CC=${{ matrix.cc }}
          if [ -n "${{ matrix.rust-linker }}" ]; then
            export CARGO_TARGET_$(echo ${{ matrix.rust-target }} | tr '[:lower:]' '[:upper:]' | tr '-' '_')_LINKER=${{ matrix.rust-linker }}
          fi
          cargo build --release --target ${{ matrix.rust-target }}
        shell: bash

      # ============================================================
      # Copy Rust artifacts to path expected by cgo LDFLAGS
      # ============================================================
      - name: Copy Rust artifacts to core/target/release
        shell: bash
        run: |
          mkdir -p core/target/release
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp core/target/${{ matrix.rust-target }}/release/smp_core.dll core/target/release/ 2>/dev/null || true
            cp core/target/${{ matrix.rust-target }}/release/libsmp_core.dll.a core/target/release/ 2>/dev/null || true
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            cp core/target/${{ matrix.rust-target }}/release/libsmp_core.dylib core/target/release/ 2>/dev/null || true
          else
            cp core/target/${{ matrix.rust-target }}/release/libsmp_core.so core/target/release/ 2>/dev/null || true
          fi
          echo "=== Rust output: core/target/${{ matrix.rust-target }}/release/ ==="
          ls -la core/target/${{ matrix.rust-target }}/release/ 2>/dev/null || true
          echo "=== core/target/release ==="
          ls -la core/target/release/

      # ============================================================
      # Build Go Server & Client
      # ============================================================
      - name: Build Server (Go)
        run: |
          export CGO_ENABLED=1
          export CC=${{ matrix.cc }}
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          go build -o smp-server${{ matrix.ext }} ./cmd/smp-server/
        working-directory: server
        shell: bash

      - name: Build Client (Go)
        run: |
          export CGO_ENABLED=1
          export CC=${{ matrix.cc }}
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          go build -o smp${{ matrix.ext }} ./cmd/smp/
        working-directory: client
        shell: bash

      # ============================================================
      # Collect & Upload
      # ============================================================
      - name: Collect Artifacts
        shell: bash
        run: |
          mkdir -p target
          cp core/target/${{ matrix.rust-target }}/release/smp_core* target/ 2>/dev/null || true
          cp core/target/${{ matrix.rust-target }}/release/libsmp_core* target/ 2>/dev/null || true
          cp cfm/target/${{ matrix.rust-target }}/release/cfm* target/ 2>/dev/null || true
          cp cfm/target/${{ matrix.rust-target }}/release/libcfm* target/ 2>/dev/null || true
          cp server/smp-server* target/ 2>/dev/null || true
          cp client/smp* target/ 2>/dev/null || true
          echo "=== target/ contents ==="
          ls -la target/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smp-${{ matrix.os }}-${{ matrix.arch }}
          path: target/
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  # Merge every per-arch artifact into one smptools.zip
  # ============================================================
  merge-artifacts:
    name: Merge Artifacts
    runs-on: ubuntu-latest
    needs: build
    # needs.build.result is aggregated over the whole matrix, so it only
    # resolves to 'success' when every build job succeeded. One failed
    # matrix leg therefore skips this job instead of failing it.
    if: ${{ needs.build.result == 'success' }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          # Every matching artifact of this run. Each one lands in its own
          # folder named after the artifact, i.e. smp-<matrix.os>-<matrix.arch>/.
          pattern: smp-*

      - name: Reorganize into <os>-<arch>-smptools folders
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zip >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip unzip
          fi

          OUT=smptools
          rm -rf "$OUT" smptools.zip
          mkdir -p "$OUT"

          shopt -s nullglob
          arts=(smp-*/)
          if [ "${#arts[@]}" -eq 0 ]; then
            echo "::error::No artifacts matching smp-* were downloaded"
            exit 1
          fi

          for dir in "${arts[@]}"; do
            art="$(basename "$dir")"      # smp-windows-latest-x86_64
            key="${art#smp-}"             # windows-latest-x86_64
            arch="${key##*-}"             # x86_64
            host="${key%"-$arch"}"        # windows-latest

            case "$host" in
              windows*)       sys=windows ;;
              macos*)         sys=macos ;;
              ubuntu*|linux*) sys=linux ;;
              *)
                echo "::error::Cannot map artifact '$art' to an OS name"
                exit 1
                ;;
            esac

            dest="$OUT/$sys-$arch-smptools"
            mkdir -p "$dest"

            # upload-artifact@v4 stores the *contents* of target/, so the files
            # arrive flat inside smp-<os>-<arch>/. If an artifact ever ships a
            # single nested target/ folder instead, unwrap it so $dest stays
            # flat either way.
            entries=( "$dir"/* )
            if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ] && [ "$(basename "${entries[0]}")" = "target" ]; then
              cp -R "${entries[0]}/." "$dest/"
            else
              cp -R "$dir/." "$dest/"
            fi

            echo "=== $dest ==="
            ls -la "$dest"
          done

          cd "$OUT"
          zip -r -9 ../smptools.zip */
          cd ..

          echo "=== smptools.zip ($(du -h smptools.zip | cut -f1)) ==="
          unzip -l smptools.zip | head -60

      - name: Upload merged artifact
        uses: actions/upload-artifact@v4
        with:
          name: smptools
          path: smptools.zip
          retention-days: 30
