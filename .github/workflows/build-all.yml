name: Build All

on:
  push:
    branches: [actions]
    paths:
      - 'core/**'
      - 'cfm/**'
      - 'server/**'
      - 'client/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'actions'
        type: string

env:
  GO_MIN_VER: "1.21"

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            arch: x86_64
            goos: windows
            goarch: amd64
            rust-target: x86_64-pc-windows-msvc
            ext: ".exe"
            cc: clang
          - os: windows-latest
            arch: arm64
            goos: windows
            goarch: arm64
            rust-target: aarch64-pc-windows-msvc
            ext: ".exe"
            cc: clang

          # macOS
          - os: macos-latest
            arch: x86_64
            goos: darwin
            goarch: amd64
            rust-target: x86_64-apple-darwin
            ext: ""
            cc: clang
          - os: macos-latest
            arch: arm64
            goos: darwin
            goarch: arm64
            rust-target: aarch64-apple-darwin
            ext: ""
            cc: clang

          # Linux
          - os: ubuntu-latest
            arch: x86_64
            goos: linux
            goarch: amd64
            rust-target: x86_64-unknown-linux-gnu
            ext: ""
            cc: gcc
          - os: ubuntu-latest
            arch: x86
            goos: linux
            goarch: 386
            rust-target: i686-unknown-linux-gnu
            ext: ""
            cc: gcc
          - os: ubuntu-latest
            arch: arm64
            goos: linux
            goarch: arm64
            rust-target: aarch64-unknown-linux-gnu
            ext: ""
            cc: gcc

    steps:
      # ============================================================
      # Setup
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_MIN_VER }}

      # ============================================================
      # Build Rust Core & CFM
      # ============================================================
      - name: Build Core (Rust)
        working-directory: core
        run: |
          cargo build --release --target ${{ matrix.rust-target }}
        shell: bash

      - name: Build CFM (Rust)
        working-directory: cfm
        run: |
          cargo build --release --target ${{ matrix.rust-target }}
        shell: bash

      # ============================================================
      # Build Go Server & Client
      # ============================================================
      - name: Build Server (Go)
        run: |
          export CGO_ENABLED=1
          export CC=${{ matrix.cc }}
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          go build -o smp-server${{ matrix.ext }} ./cmd/smp-server/
        working-directory: server
        shell: bash

      - name: Build Client (Go)
        run: |
          export CGO_ENABLED=1
          export CC=${{ matrix.cc }}
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          go build -o smp${{ matrix.ext }} ./cmd/smp/
        working-directory: client
        shell: bash

      # ============================================================
      # Collect & Upload
      # ============================================================
      - name: Collect Artifacts
        shell: bash
        run: |
          mkdir -p target
          cp core/target/${{ matrix.rust-target }}/release/smp_core* target/ 2>/dev/null || true
          cp cfm/target/${{ matrix.rust-target }}/release/cfm* target/ 2>/dev/null || true
          cp server/smp-server* target/ 2>/dev/null || true
          cp client/smp* target/ 2>/dev/null || true
          echo "=== target/ contents ==="
          ls -la target/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smp-${{ matrix.os }}-${{ matrix.arch }}
          path: target/
          if-no-files-found: warn
          retention-days: 30
