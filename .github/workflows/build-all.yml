name: Build All

on:
  push:
    branches: [actions]
    paths:
      - 'core/**'
      - 'cfm/**'
      - 'server/**'
      - 'client/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'actions'
        type: string

env:
  GO_MIN_VER: "1.21"

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            arch: x86_64
            goos: windows
            goarch: amd64
            rust-target: x86_64-pc-windows-msvc
            ext: ".exe"
            cc: clang
          # Windows arm64 is skipped: Go cgo cannot cross-compile to ARM64
          # on x86_64 Windows (clang cannot assemble ARM64 instructions).
          # Use a windows-11-arm runner to build natively instead.

          # macOS
          - os: macos-latest
            arch: x86_64
            goos: darwin
            goarch: amd64
            rust-target: x86_64-apple-darwin
            ext: ""
            cc: clang
          - os: macos-latest
            arch: arm64
            goos: darwin
            goarch: arm64
            rust-target: aarch64-apple-darwin
            ext: ""
            cc: clang

          # Linux
          - os: ubuntu-latest
            arch: x86_64
            goos: linux
            goarch: amd64
            rust-target: x86_64-unknown-linux-gnu
            ext: ""
            cc: gcc
          - os: ubuntu-latest
            arch: x86
            goos: linux
            goarch: 386
            rust-target: i686-unknown-linux-gnu
            ext: ""
            cc: gcc
          - os: ubuntu-latest
            arch: arm64
            goos: linux
            goarch: arm64
            rust-target: aarch64-unknown-linux-gnu
            ext: ""
            cc: gcc

    steps:
      # ============================================================
      # Setup
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_MIN_VER }}

      # Install cross-compilation dependencies for Linux targets
      - name: Install cross-compilation deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "x86" ]; then
            sudo apt-get install -y gcc-multilib libc6-dev-i386
          fi
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # Build Rust Core & CFM
      # ============================================================
      - name: Build Core (Rust)
        working-directory: core
        run: |
          cargo build --release --target ${{ matrix.rust-target }}
        shell: bash

      - name: Build CFM (Rust)
        working-directory: cfm
        run: |
          cargo build --release --target ${{ matrix.rust-target }}
        shell: bash

      # ============================================================
      # Copy Rust artifacts to path expected by cgo LDFLAGS
      # ============================================================
      - name: Copy Rust artifacts to core/target/release
        shell: bash
        run: |
          mkdir -p core/target/release
          # Copy smp_core dynamic library
          cp core/target/${{ matrix.rust-target }}/release/libsmp_core.so core/target/release/ 2>/dev/null || \
          cp core/target/${{ matrix.rust-target }}/release/libsmp_core.dylib core/target/release/ 2>/dev/null || \
          cp core/target/${{ matrix.rust-target }}/release/smp_core.dll core/target/release/ || true
          # Copy MSVC import library (.lib) for Windows cgo linking
          cp core/target/${{ matrix.rust-target }}/release/smp_core.lib core/target/release/ 2>/dev/null || \
          cp core/target/${{ matrix.rust-target }}/release/smp_core.dll.lib core/target/release/ 2>/dev/null || true
          echo "=== Rust output: core/target/${{ matrix.rust-target }}/release/ ==="
          ls -la core/target/${{ matrix.rust-target }}/release/ 2>/dev/null || true
          echo "=== core/target/release ==="
          ls -la core/target/release/

      # ============================================================
      # Build Go Server & Client
      # ============================================================
      - name: Build Server (Go)
        run: |
          export CGO_ENABLED=1
          export CC=${{ matrix.cc }}
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          go build -o smp-server${{ matrix.ext }} ./cmd/smp-server/
        working-directory: server
        shell: bash

      - name: Build Client (Go)
        run: |
          export CGO_ENABLED=1
          export CC=${{ matrix.cc }}
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          go build -o smp${{ matrix.ext }} ./cmd/smp/
        working-directory: client
        shell: bash

      # ============================================================
      # Collect & Upload
      # ============================================================
      - name: Collect Artifacts
        shell: bash
        run: |
          mkdir -p target
          cp core/target/${{ matrix.rust-target }}/release/smp_core* target/ 2>/dev/null || true
          cp cfm/target/${{ matrix.rust-target }}/release/cfm* target/ 2>/dev/null || true
          cp server/smp-server* target/ 2>/dev/null || true
          cp client/smp* target/ 2>/dev/null || true
          echo "=== target/ contents ==="
          ls -la target/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smp-${{ matrix.os }}-${{ matrix.arch }}
          path: target/
          if-no-files-found: warn
          retention-days: 30
