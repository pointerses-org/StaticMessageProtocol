name: Auto Sync Main → Actions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    name: Sync to Actions Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Check if Sync Needed
        id: check
        shell: bash
        run: |
          MAIN_COMMIT=$(git rev-parse main)

          # Check if actions branch exists locally
          if git rev-parse --verify actions > /dev/null 2>&1; then
            ACTIONS_COMMIT=$(git rev-parse actions)
          else
            ACTIONS_COMMIT=""
          fi

          if [ -z "$ACTIONS_COMMIT" ]; then
            echo "sync=true" >> $GITHUB_OUTPUT
            echo "Actions branch does not exist yet, will create it"
          elif [ "$MAIN_COMMIT" != "$ACTIONS_COMMIT" ]; then
            echo "sync=true" >> $GITHUB_OUTPUT
            echo "Sync needed: main=$MAIN_COMMIT actions=$ACTIONS_COMMIT"
          else
            echo "sync=false" >> $GITHUB_OUTPUT
            echo "Already in sync: $MAIN_COMMIT"
          fi

      - name: Push to Actions Branch
        if: steps.check.outputs.sync == 'true'
        shell: bash
        run: |
          git checkout -B actions main
          git push --force origin actions:actions

          echo "=== Sync complete ==="
          echo "main:   $(git rev-parse main)"
          echo "actions: $(git rev-parse actions)"
